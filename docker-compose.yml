version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_rafi
    env_file:
      - .env
    ports:
      - "22087:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_rafi
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "44087:80"
    depends_on:
      - db

volumes:
  postgres_data: